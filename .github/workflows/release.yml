name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: 'true'

jobs:
  # ============================================
  # Build Android APKs (Per-arch matrix)
  # ============================================
  build-android-arch:
    name: Build Android (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-linux-android
          - arch: armv7
            target: armv7-linux-androideabi
          - arch: i686
            target: i686-linux-android
          - arch: x86_64
            target: x86_64-linux-android

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('src-tauri/gen/android/**/*.gradle*', 'src-tauri/gen/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ matrix.arch }}-
            gradle-${{ runner.os }}-

      - name: Install Android NDK + Build Tools
        run: sdkmanager --install "ndk;27.3.13750724" "build-tools;34.0.0" "platforms;android-36"

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-targets: false
          key: release-android-${{ matrix.arch }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Android signing
        run: |
          cd src-tauri/gen/android/app
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > key.properties
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> key.properties
          base64 -d <<< "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" > "$RUNNER_TEMP/keystore.jks"
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> key.properties

      - name: Build Android APK (${{ matrix.arch }})
        run: NDK_HOME="$ANDROID_HOME/ndk/27.3.13750724" bash scripts/build-android.sh "${{ matrix.arch }}"

      - name: sccache stats
        run: sccache --show-stats || true

      - name: Upload Android APK (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ matrix.arch }}
          path: release/**/*.apk

  # ============================================
  # Build Android Universal APK
  # ============================================
  build-android-universal:
    name: Build Android (universal)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-universal-${{ hashFiles('src-tauri/gen/android/**/*.gradle*', 'src-tauri/gen/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-universal-
            gradle-${{ runner.os }}-

      - name: Install Android NDK + Build Tools
        run: sdkmanager --install "ndk;27.3.13750724" "build-tools;34.0.0" "platforms;android-36"

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-targets: false
          key: release-android-universal

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Android signing
        run: |
          cd src-tauri/gen/android/app
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > key.properties
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> key.properties
          base64 -d <<< "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" > "$RUNNER_TEMP/keystore.jks"
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> key.properties

      - name: Build Android universal APK
        run: NDK_HOME="$ANDROID_HOME/ndk/27.3.13750724" bash scripts/build-android.sh all

      - name: sccache stats
        run: sccache --show-stats || true

      - name: Upload Android universal APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-universal
          path: release/**/*.apk

  # ============================================
  # Build Windows NSIS (x64 + ARM64 in parallel)
  # ============================================
  build-windows-arch:
    name: Build Windows (${{ matrix.label }})
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x64
            target: x86_64-pc-windows-msvc
          - label: arm64
            target: aarch64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Disable Windows Defender
        run: Set-MpPreference -ExclusionPath ${{ github.workspace }}
        shell: powershell

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-targets: false
          key: release-windows-${{ matrix.label }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows NSIS (${{ matrix.label }})
        run: bash scripts/build-windows.sh "${{ matrix.target }}"
        shell: bash

      - name: Sign Windows installer (standard certificate if configured)
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PASSWORD)) {
            Write-Host "No standard Windows signing certificate configured; installer remains unsigned."
            exit 0
          }

          $certPath = Join-Path $env:RUNNER_TEMP "tin-signing-cert.pfx"
          [System.IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))

          $exeFiles = Get-ChildItem -Path "release" -Filter *.exe -Recurse
          if ($exeFiles.Count -eq 0) {
            throw "No NSIS installer found in release folder."
          }

          foreach ($exe in $exeFiles) {
            Write-Host "Signing $($exe.FullName)"
            & signtool sign /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 /f $certPath /p $env:WINDOWS_CERT_PASSWORD $exe.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "signtool failed for $($exe.FullName)"
            }
          }

      - name: sccache stats
        run: sccache --show-stats || true
        shell: bash

      - name: Upload Windows installer (${{ matrix.label }})
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-${{ matrix.label }}
          path: release/**/*.exe

  # ============================================
  # Build Linux AppImage/deb
  # ============================================
  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf mold

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-targets: false
          key: release-linux

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux bundles
        run: bash scripts/build-linux.sh appimage,deb
        env:
          RUSTFLAGS: '-C link-arg=-fuse-ld=mold'

      - name: sccache stats
        run: sccache --show-stats || true

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: release/**/*.AppImage

      - name: Upload Linux deb
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: release/**/*.deb

  # ============================================
  # Build macOS DMG (unsigned)
  # ============================================
  build-macos:
    name: Build macOS (unsigned)
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-targets: false
          key: release-macos

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS DMG (unsigned)
        run: bash scripts/build-macos.sh

      - name: sccache stats
        run: sccache --show-stats || true

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: release/**/*.dmg

  # ============================================
  # Create GitHub Release
  # ============================================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [build-android-arch, build-android-universal, build-windows-arch, build-linux, build-macos]

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all Android APKs
        uses: actions/download-artifact@v4
        with:
          pattern: android-apk-*
          path: artifacts/android

      - name: Download all Windows installers
        uses: actions/download-artifact@v4
        with:
          pattern: windows-nsis-*
          path: artifacts/windows

      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: artifacts/linux

      - name: Download Linux deb
        uses: actions/download-artifact@v4
        with:
          name: linux-deb
          path: artifacts/linux

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: artifacts/macos

      - name: List release artifacts
        run: |
          echo "=== Android ==="
          find artifacts/android -type f -name "*.apk" || true
          echo "=== Windows ==="
          find artifacts/windows -type f -name "*.exe" || true
          echo "=== Linux ==="
          find artifacts/linux -type f \( -name "*.AppImage" -o -name "*.deb" \) || true
          echo "=== macOS ==="
          find artifacts/macos -type f -name "*.dmg" || true

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: Tin ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Download matrix

            ### Android APKs (all variants)
            - ARM64 (`arm64-v8a`)
            - ARMv7 (`armeabi-v7a`)
            - x86
            - x86_64
            - Universal APK

            ### Windows (NSIS)
            - x64 installer
            - ARM64 installer

            ### Linux
            - AppImage
            - Debian package (`.deb`)

            ### macOS
            - Unsigned DMG build (Gatekeeper warning expected)

            ## Install notices

            - **Windows SmartScreen blue warning**:
              If you see **"Windows protected your PC"**, click **More info** then **Run anyway**.
            - **macOS Gatekeeper warning (unsigned app)**:
              Right-click the app and choose **Open**, then click **Open** again.
          files: |
            artifacts/android/**/*.apk
            artifacts/windows/**/*.exe
            artifacts/linux/**/*.AppImage
            artifacts/linux/**/*.deb
            artifacts/macos/**/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
